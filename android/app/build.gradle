apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    newArchEnabled = false
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true

project.ext.react = [
    enableHermes: true
]

android {
    namespace "com.facesense"

    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.facesense"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0"

        

        /**
         * Reduce resource size
         */
        resConfigs "en"
    }

    
    splits {
    abi {
        enable true
        reset()
        include "armeabi-v7a", "arm64-v8a"
        universalApk false
    }
}


    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.keystore')
            storePassword 'password'
            keyAlias 'release'
            keyPassword 'password'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release

            /**
             * Code + resource shrinking
             */
            minifyEnabled true
            shrinkResources true

            /**
             * Required for RN + Skia + ML Kit
             */
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"

            /**
             * Avoid shipping native debug symbols
             */
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    /**
     * ML Kit (heavy but required)
     */
    implementation "com.google.mlkit:face-detection:16.1.7"

    /**
     * Hermes (already smaller than JSC)
     */
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
